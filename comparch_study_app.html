<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Architecture — Interactive Study Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --bg4: #222736;
    --border: #2a2f3f;
    --border2: #363d52;
    --text: #e8eaf0;
    --text2: #9ba3b8;
    --text3: #6b7494;
    --accent: #5b8df8;
    --accent2: #7aa3ff;
    --accent-bg: rgba(91,141,248,0.1);
    --accent-border: rgba(91,141,248,0.3);
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.1);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.1);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.1);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.1);
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.1);
    --coral: #fb923c;
    --coral-bg: rgba(251,146,60,0.1);
    --sidebar-w: 280px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 15px;
    line-height: 1.6;
  }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent2);
    font-family: var(--mono);
  }
  .sidebar-header p {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
  }

  .progress-bar {
    margin: 12px 18px 0;
    background: var(--bg3);
    border-radius: 99px;
    height: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 10px;
    color: var(--text3);
    font-family: var(--mono);
    margin: 5px 18px 0;
  }

  .nav-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }
  .nav-list::-webkit-scrollbar { width: 4px; }
  .nav-list::-webkit-scrollbar-track { background: transparent; }
  .nav-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .nav-section {
    padding: 8px 18px 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    font-family: var(--mono);
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 2px solid transparent;
    font-size: 13px;
    color: var(--text2);
    user-select: none;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active {
    background: var(--accent-bg);
    border-left-color: var(--accent);
    color: var(--accent2);
  }
  .nav-item .nav-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    min-width: 18px;
  }
  .nav-item.active .nav-num { color: var(--accent); }
  .nav-item .check {
    margin-left: auto;
    font-size: 11px;
    color: var(--green);
    display: none;
  }
  .nav-item.done .check { display: block; }

  /* MAIN */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: transparent; }
  #main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .topic-content {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 40px 80px;
  }

  .topic-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 99px;
    padding: 3px 12px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    margin-bottom: 14px;
  }

  .topic-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .topic-subtitle {
    font-size: 15px;
    color: var(--text2);
    margin-bottom: 30px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin: 24px 0 10px;
  }

  p { color: var(--text2); margin-bottom: 12px; line-height: 1.75; }

  /* INFO BOXES */
  .box {
    border-radius: 10px;
    padding: 16px 18px;
    margin: 16px 0;
    border: 1px solid;
  }
  .box-info { background: var(--accent-bg); border-color: var(--accent-border); }
  .box-info .box-title { color: var(--accent2); }
  .box-green { background: var(--green-bg); border-color: rgba(74,222,128,0.25); }
  .box-green .box-title { color: var(--green); }
  .box-amber { background: var(--amber-bg); border-color: rgba(251,191,36,0.25); }
  .box-amber .box-title { color: var(--amber); }
  .box-purple { background: var(--purple-bg); border-color: rgba(167,139,250,0.25); }
  .box-purple .box-title { color: var(--purple); }
  .box-teal { background: var(--teal-bg); border-color: rgba(45,212,191,0.25); }
  .box-teal .box-title { color: var(--teal); }
  .box-coral { background: var(--coral-bg); border-color: rgba(251,146,60,0.25); }
  .box-coral .box-title { color: var(--coral); }

  .box-title {
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .box p { margin-bottom: 0; font-size: 14px; }

  /* CODE BLOCKS */
  .code-block {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    margin: 14px 0;
    overflow-x: auto;
    line-height: 1.7;
  }
  .code-block .comment { color: var(--text3); }
  .code-block .kw { color: var(--purple); }
  .code-block .val { color: var(--amber); }
  .code-block .str { color: var(--green); }
  .code-block .op { color: var(--accent); }

  /* TABLES */
  .styled-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 13px;
  }
  .styled-table th {
    background: var(--bg3);
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--text);
    border-bottom: 1px solid var(--border2);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .styled-table td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: top;
  }
  .styled-table tr:last-child td { border-bottom: none; }
  .styled-table tr:hover td { background: var(--bg3); }

  /* DIAGRAM */
  .diagram {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin: 16px 0;
    overflow-x: auto;
  }

  /* LAYER STACK */
  .layer-stack { display: flex; flex-direction: column; gap: 3px; margin: 16px 0; }
  .layer {
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: default;
    transition: filter 0.2s;
  }
  .layer:hover { filter: brightness(1.2); }
  .layer-label { font-family: var(--mono); font-size: 11px; }

  /* QUIZ */
  .quiz-section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin: 30px 0 0;
  }
  .quiz-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .quiz-header h3 { margin: 0; font-size: 15px; }
  .quiz-badge {
    background: var(--purple-bg);
    border: 1px solid rgba(167,139,250,0.25);
    color: var(--purple);
    font-size: 11px;
    font-family: var(--mono);
    padding: 2px 10px;
    border-radius: 99px;
  }
  .quiz-q {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text2);
    background: var(--bg3);
    transition: all 0.15s;
    text-align: left;
  }
  .quiz-opt:hover { border-color: var(--border2); color: var(--text); background: var(--bg4); }
  .quiz-opt.correct { border-color: rgba(74,222,128,0.5); background: var(--green-bg); color: var(--green); }
  .quiz-opt.wrong { border-color: rgba(248,113,113,0.5); background: var(--red-bg); color: var(--red); }
  .quiz-opt.disabled { cursor: default; pointer-events: none; }

  .quiz-feedback {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.correct { background: var(--green-bg); border: 1px solid rgba(74,222,128,0.25); color: var(--green); }
  .quiz-feedback.wrong { background: var(--red-bg); border: 1px solid rgba(248,113,113,0.25); color: var(--red); }

  .quiz-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
  }
  .quiz-progress { font-size: 12px; color: var(--text3); font-family: var(--mono); }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--bg4); border-color: var(--accent-border); color: var(--accent2); }
  .btn-primary {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    color: var(--accent2);
  }
  .btn-primary:hover { background: rgba(91,141,248,0.2); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  /* REGISTER VIZ */
  .register-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
    font-family: var(--mono);
    font-size: 13px;
  }
  .reg-name {
    width: 50px;
    color: var(--accent2);
    font-weight: 500;
  }
  .reg-bits {
    display: flex;
    gap: 2px;
  }
  .bit {
    width: 22px;
    height: 26px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--green);
    transition: all 0.2s;
    cursor: default;
  }
  .bit.hi { background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.4); }
  .bit-group-label {
    font-size: 10px;
    color: var(--text3);
    text-align: center;
    margin-top: 2px;
  }
  .reg-desc { color: var(--text2); font-size: 12px; margin-left: 6px; }

  /* INTERACTIVE DEMO */
  .demo-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin: 16px 0;
  }
  .demo-title {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }

  /* BUS DEMO */
  .bus-reg {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    border-radius: 6px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .bus-reg:hover { border-color: var(--accent-border); color: var(--accent2); }
  .bus-reg.selected { background: var(--accent-bg); border-color: var(--accent); color: var(--accent2); }
  .bus-line {
    height: 3px;
    background: var(--border2);
    position: relative;
    margin: 8px 0;
    border-radius: 2px;
    transition: background 0.3s;
  }
  .bus-line.active { background: var(--accent); box-shadow: 0 0 8px var(--accent-border); }

  /* INSTRUCTION CYCLE */
  .cycle-step {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    margin: 8px 0;
    transition: all 0.3s;
  }
  .cycle-step.active-step {
    border-color: var(--accent-border);
    background: var(--accent-bg);
  }
  .cycle-step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg4);
    border: 1px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .cycle-step.active-step .cycle-step-num {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent2);
  }
  .cycle-step-title { font-weight: 600; font-size: 14px; color: var(--text); }
  .cycle-step-desc { font-size: 13px; color: var(--text2); margin-top: 3px; }

  .scroll-top-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
  }
  .scroll-top-btn.visible { opacity: 1; pointer-events: auto; }
  .scroll-top-btn:hover { background: var(--bg4); color: var(--accent2); border-color: var(--accent-border); }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    margin: 2px;
  }
  .tag-blue { background: var(--accent-bg); color: var(--accent2); }
  .tag-green { background: var(--green-bg); color: var(--green); }
  .tag-amber { background: var(--amber-bg); color: var(--amber); }
  .tag-purple { background: var(--purple-bg); color: var(--purple); }
  .tag-teal { background: var(--teal-bg); color: var(--teal); }
  .tag-coral { background: var(--coral-bg); color: var(--coral); }

  ul, ol { padding-left: 1.4em; margin: 10px 0; }
  li { color: var(--text2); margin: 5px 0; font-size: 14px; line-height: 1.65; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  .mono-label { font-family: var(--mono); font-size: 12px; color: var(--accent); }

  .exam-tip {
    border-left: 3px solid var(--amber);
    padding-left: 14px;
    margin: 14px 0;
  }
  .exam-tip .tip-label { font-size: 11px; font-family: var(--mono); color: var(--amber); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .exam-tip p { font-size: 13px; margin: 0; }

  .formula {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--purple);
    margin: 10px 0;
    text-align: center;
  }

  /* Microop table */
  .micro-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 14px 0;
  }
  .micro-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .micro-card-title { font-family: var(--mono); font-size: 12px; color: var(--text3); margin-bottom: 6px; }
  .micro-card-op { font-family: var(--mono); font-size: 13px; color: var(--accent2); margin: 3px 0; }
  .micro-card-desc { font-size: 12px; color: var(--text2); }

  /* Loading */
  #loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 10px; }
  #loading .spin { width: 30px; height: 30px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>CompArch Study</h1>
    <p>Mano Book — All 7 Lectures</p>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <p class="progress-label" id="progress-label">0 / 14 topics done</p>
  <div class="nav-list" id="nav-list"></div>
</div>

<div id="main">
  <div class="topic-content" id="topic-content">
    <div id="loading"><div class="spin"></div><p style="color:var(--text3);font-size:13px;">Loading topics...</p></div>
  </div>
</div>

<button class="scroll-top-btn" id="scroll-top" onclick="document.getElementById('main').scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const topics = [
  {
    id: 'intro',
    lecture: 'Lecture 1',
    title: 'What is Computer Architecture?',
    subtitle: 'Abstraction layers, ISA, and the bridge between software and hardware',
    content: () => `
      <p>Computer Architecture sits at the boundary between pure computer science and pure electronics. It's the study of the design and organization of computer systems — how hardware and software interact through carefully designed layers of abstraction.</p>

      <h3>The Abstraction Stack</h3>
      <p>Think of a computer as a tower of layers. Each layer hides complexity from the one above it, communicating only through well-defined interfaces.</p>
      <div class="layer-stack" id="layer-stack"></div>

      <div class="box box-info">
        <div class="box-title">💡 Key Insight</div>
        <p>Computer Architecture specifically covers the <strong>ISA, Microarchitecture, RTL, Gates, and Devices</strong> layers — bridging pure CS (algorithms, languages) and pure Electronics (physics).</p>
      </div>

      <h3>General Computer Block Diagram</h3>
      <p>Every computer, from a smartwatch to a supercomputer, contains these fundamental components:</p>
      <div class="diagram">
        <svg width="100%" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" style="font-family:'JetBrains Mono',monospace">
          <!-- CPU box -->
          <rect x="180" y="20" width="240" height="160" rx="8" fill="#1a1e28" stroke="#363d52" stroke-width="1.5"/>
          <text x="300" y="42" text-anchor="middle" fill="#5b8df8" font-size="12" font-weight="600">CPU</text>
          <rect x="200" y="52" width="90" height="46" rx="5" fill="#222736" stroke="#2a2f3f"/>
          <text x="245" y="71" text-anchor="middle" fill="#e8eaf0" font-size="11">Datapath</text>
          <text x="245" y="88" text-anchor="middle" fill="#9ba3b8" font-size="10">(ALU, Registers)</text>
          <rect x="310" y="52" width="90" height="46" rx="5" fill="#222736" stroke="#2a2f3f"/>
          <text x="355" y="71" text-anchor="middle" fill="#e8eaf0" font-size="11">Control</text>
          <text x="355" y="88" text-anchor="middle" fill="#9ba3b8" font-size="10">(FSM, Timing)</text>
          <rect x="210" y="112" width="160" height="36" rx="5" fill="#222736" stroke="#2a2f3f"/>
          <text x="290" y="135" text-anchor="middle" fill="#e8eaf0" font-size="11">Cache Memory</text>
          <!-- Memory -->
          <rect x="30" y="80" width="110" height="50" rx="5" fill="#1a1e28" stroke="#363d52"/>
          <text x="85" y="101" text-anchor="middle" fill="#4ade80" font-size="11">Memory</text>
          <text x="85" y="118" text-anchor="middle" fill="#9ba3b8" font-size="9">(RAM / ROM)</text>
          <!-- Input -->

    content: () => `
      <p>Register Transfer Language (RTL) is a symbolic notation used to describe microoperations — the elementary data movement and processing steps inside a digital computer.</p>

      <h3>What is a Microoperation?</h3>
      <div class="box box-info">
        <div class="box-title">Definition</div>
        <p>A <strong>microoperation</strong> is an elementary operation performed on data stored in one or more registers. Examples: shift, count, clear, load, add.</p>
      </div>

      <h3>Register Naming Conventions</h3>
      <p>Registers are named with capital letters that reflect their function. The individual flip-flops are numbered 0 (rightmost) to n-1 (leftmost).</p>
      <table class="styled-table">
        <thead><tr><th>Symbol</th><th>Register Name</th><th>Function</th></tr></thead>
        <tbody>
          <tr><td><span class="mono-label">MAR</span></td><td>Memory Address Register</td><td>Holds address to access in memory (12 bits)</td></tr>
          <tr><td><span class="mono-label">PC</span></td><td>Program Counter</td><td>Holds address of next instruction (12 bits)</td></tr>
          <tr><td><span class="mono-label">IR</span></td><td>Instruction Register</td><td>Holds the current instruction being decoded (16 bits)</td></tr>
          <tr><td><span class="mono-label">AC</span></td><td>Accumulator</td><td>General purpose processor register (16 bits)</td></tr>
          <tr><td><span class="mono-label">DR</span></td><td>Data Register</td><td>Holds data read from/to be written to memory</td></tr>
          <tr><td><span class="mono-label">TR</span></td><td>Temporary Register</td><td>Holds temporary values during computation</td></tr>
        </tbody>
      </table>

      <h3>RTL Notation — Transfer Statements</h3>
      <div class="box box-purple">
        <div class="box-title">Basic Transfer</div>
        <p>R2 ← R1 means "copy the content of R1 into R2." The source R1 is <em>unchanged</em>.</p>
      </div>
      <div class="code-block"><span class="comment">// Unconditional transfer</span>
R2 <span class="op">←</span> R1       <span class="comment">// Copy R1 into R2 every clock cycle</span>

<span class="comment">// Conditional transfer</span>
P: R2 <span class="op">←</span> R1     <span class="comment">// Only if control signal P = 1</span>

<span class="comment">// Simultaneous exchange (using edge-triggered flip-flops)</span>
T: R2 <span class="op">←</span> R1, R1 <span class="op">←</span> R2   <span class="comment">// Swap R1 and R2 in one clock cycle</span>

<span class="comment">// Memory transfers</span>
DR <span class="op">←</span> M[AR]    <span class="comment">// READ: load data from memory address in AR</span>
M[AR] <span class="op">←</span> DR    <span class="comment">// WRITE: store DR into memory address in AR</span></div>

      <div class="exam-tip">
        <div class="tip-label">⚠️ Critical: Clock Timing</div>
        <p>Even if control signal P becomes active at time t, the actual register transfer happens at the NEXT positive clock edge (t+1). The clock is implicit — not written in RTL statements.</p>
      </div>

      <h3>Bit-Field Notation</h3>
      <p>A 16-bit register PC can be split into two bytes:</p>
      <div class="code-block">PC(0-7)  <span class="comment">// or PC(L) — Low byte</span>
PC(8-15) <span class="comment">// or PC(H) — High byte</span>

<span class="comment">// Example: IR has 16 bits split as:</span>
IR(15)   <span class="comment">// I-bit (indirect addressing flag)</span>
IR(12-14)<span class="comment">// Operation code (3 bits)</span>
IR(0-11) <span class="comment">// Address part (12 bits)</span></div>

      <h3>Bus System Overview</h3>
      <p>Connecting every register directly to every other register requires way too many wires. Instead, computers use a <strong>common bus</strong> — a shared highway for data.</p>
      <div class="box box-teal">
        <div class="box-title">How a Bus Works</div>
        <p>At any given moment, only ONE register can drive data onto the bus (selected by a multiplexer). Any register can READ from the bus simultaneously by enabling its load input.</p>
      </div>
      <div class="code-block"><span class="comment">// Bus transfer notation</span>
BUS <span class="op">←</span> C        <span class="comment">// Place register C on the bus</span>
R1  <span class="op">←</span> BUS      <span class="comment">// Load register R1 from bus</span>

<span class="comment">// Implied bus notation (shorthand)</span>
R1 <span class="op">←</span> C          <span class="comment">// Designer knows a bus exists</span></div>
    `,
    quiz: [
      { q: 'What does the RTL statement "P: R2 ← R1" mean?', opts: ['R2 is transferred to R1 always', 'R1 is copied to R2 only when P=1', 'R1 and R2 are added', 'P is loaded from R1'], ans: 1, exp: 'The colon separates the control condition. "P:" means execute the following transfer only when control signal P equals 1.' },

    ]

        <div class="micro-card">

        </div>
        <div class="micro-card">
          <div class="micro-card-title">2's Complement</div>

        <p>In RTL, <code>∧</code> = AND, <code>∨</code> = OR. The <code>+</code> symbol always means arithmetic ADD in a microoperation context, never OR.</p>
      </div>
      <div class="micro-grid">
        <div class="micro-card">
          <div class="micro-card-title">AND</div>
          <div class="micro-card-op">R ← R1 ∧ R2</div>

        <div class="micro-card">
          <div class="micro-card-title">XOR</div>
          <div class="micro-card-op">R ← R1 ⊕ R2</div>
          <div class="micro-card-desc">Toggles bits (flip select)</div>

        <div class="micro-card">

        let after = '';
        let desc = '';

      <div class="box box-info">
        <div class="box-title">What is a Bus?</div>
        <p>A bus is a set of <strong>n wires</strong> (one per bit) shared by all registers. Only one register drives the bus at a time; all others can read from it simultaneously.</p>
      </div>

      <h3>Building a Bus with Multiplexers</h3>
      <p>For k registers of n bits each, we need n multiplexers (one per bit position), each being a k×1 MUX.</p>
      <div class="box box-green">
        <div class="box-title">Example: 8 registers of 16 bits</div>
        <p>→ 16 multiplexers needed<br>→ Each MUX: 8 data inputs + 3 selection lines (to select among 8 registers)<br>→ 3 selection lines decode to 8 possible register choices</p>
      </div>

      <h3>Interactive Bus Demo</h3>
      <div class="demo-box">
        <div class="demo-title">▶ Click a register to put it on the bus, then click destination</div>
        <div id="bus-demo-ui"></div>
      </div>

      <h3>Three-State (Tri-State) Bus</h3>
      <p>An alternative to MUX-based buses uses <strong>three-state buffer gates</strong>. Unlike normal gates that output 0 or 1, a three-state gate has a third state: <strong>high-impedance (Z)</strong> — effectively disconnected from the bus.</p>
      <table class="styled-table">
        <thead><tr><th>State</th><th>Output</th><th>Effect</th></tr></thead>
        <tbody>
          <tr><td>Logic 1</td><td>HIGH</td><td>Drives the bus line high</td></tr>
          <tr><td>Logic 0</td><td>LOW</td><td>Drives the bus line low</td></tr>
          <tr><td>High-Z</td><td>Disconnected</td><td>Does not affect bus — others can drive</td></tr>
        </tbody>
      </table>

      <h3>Memory Read/Write via Bus</h3>
      <div class="code-block"><span class="comment">// READ from Memory</span>
<span class="kw">Read:</span>  DR <span class="op">←</span> M[AR]
  <span class="comment">// Step 1: AR already holds the address</span>
  <span class="comment">// Step 2: Memory places word on bus</span>
  <span class="comment">// Step 3: DR latches from bus</span>

<span class="comment">// WRITE to Memory</span>
<span class="kw">Write:</span> M[AR] <span class="op">←</span> DR
  <span class="comment">// Step 1: AR holds destination address</span>
  <span class="comment">// Step 2: DR is placed on bus</span>
  <span class="comment">// Step 3: Memory writes from bus</span></div>

      <div class="exam-tip">
        <div class="tip-label">📝 Key Formula</div>
        <p>A bus for k registers of n bits needs: <strong>n multiplexers</strong>, each of size <strong>k×1</strong>, controlled by <strong>log₂(k) selection bits</strong>.</p>

      <p>Designing complex digital systems at the gate and flip-flop level by hand is extremely tedious. HDLs let engineers describe hardware behavior in code, which tools can then synthesize into actual circuits.</p>

      <h3>What is an HDL?</h3>
      <div class="box box-info">
        <div class="box-title">Important Distinction</div>

          <div class="box-title">Verilog</div>

      <h3>Example: 4-bit Register in Verilog</h3>
      <div class="code-block"><span class="comment">// 4-bit D flip-flop register with synchronous load</span>
<span class="kw">module</span> register4 (
  <span class="kw">input</span>        clk,    <span class="comment">// clock signal</span>
  <span class="kw">input</span>        load,   <span class="comment">// load enable (our control signal P)</span>
  <span class="kw">input</span>  [3:0] D,      <span class="comment">// 4-bit data input</span>
  <span class="kw">output</span> [3:0] Q       <span class="comment">// 4-bit data output</span>
);
  <span class="kw">reg</span> [3:0] Q;

  <span class="kw">always</span> @(<span class="kw">posedge</span> clk) <span class="kw">begin</span>
    <span class="kw">if</span> (load)            <span class="comment">// RTL equivalent: P: Q ← D</span>
      Q <span class="op"><=</span> D;           <span class="comment">// non-blocking assignment</span>
  <span class="kw">end</span>
<span class="kw">endmodule</span></div>

      <h3>Example: Simple ALU in Verilog</h3>
      <div class="code-block"><span class="kw">module</span> alu (
  <span class="kw">input</span>  [7:0] A, B,
  <span class="kw">input</span>  [1:0] op,     <span class="comment">// 00=ADD 01=SUB 10=AND 11=OR</span>

);

  <span class="kw">end</span>

      <h3>The Von Neumann Model</h3>
      <div class="box box-info">

      <h3>The Accumulator (AC)</h3>

// Build navigation
const navList = document.getElementById('nav-list');
const lectureGroups = {};
topics.forEach((t, i) => {
  const g = t.lecture;
  if (!lectureGroups[g]) { lectureGroups[g] = []; }
  lectureGroups[g].push({ ...t, idx: i });
});

const done = new Set(JSON.parse(localStorage.getItem('ca_done') || '[]'));

function buildNav() {
  navList.innerHTML = '';
  Object.entries(lectureGroups).forEach(([lec, ts]) => {
    const sec = document.createElement('div');
    sec.className = 'nav-section';
    sec.textContent = lec;
    navList.appendChild(sec);
    ts.forEach(t => {
      const item = document.createElement('div');
      item.className = 'nav-item' + (done.has(t.id) ? ' done' : '');
      item.id = 'nav-' + t.id;
      item.innerHTML = `<span class="nav-num">${String(t.idx+1).padStart(2,'0')}</span><span>${t.title}</span><span class="check">✓</span>`;
      item.onclick = () => loadTopic(t.idx);
      navList.appendChild(item);
    });
  });
  updateProgress();
}

function updateProgress() {
  const total = topics.length;
  const doneCount = done.size;
  const pct = (doneCount / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${doneCount} / ${total} topics done`;
}

let currentTopic = 0;
let quizState = {};

function loadTopic(idx) {
  currentTopic = idx;
  const t = topics[idx];
  // Update nav
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const ni = document.getElementById('nav-' + t.id);
  if (ni) { ni.classList.add('active'); ni.scrollIntoView({ block: 'nearest' }); }
  // Build content
  document.getElementById('main').scrollTo({ top: 0 });
  const tc = document.getElementById('topic-content');
  quizState = { current: 0, answered: false, score: 0 };
  const quiz = t.quiz || [];
  tc.innerHTML = `
    <div class="topic-badge">
      <span>${t.lecture}</span>
    </div>
    <div class="topic-title">${t.title}</div>
    <div class="topic-subtitle">${t.subtitle}</div>
    <div class="divider"></div>
    ${t.content()}
    ${quiz.length ? buildQuiz(quiz, 0) : ''}
    <div style="display:flex;gap:10px;margin-top:30px">
      ${idx > 0 ? `<button class="btn" onclick="loadTopic(${idx-1})">← Previous</button>` : ''}
      ${idx < topics.length-1 ? `<button class="btn btn-primary" onclick="loadTopic(${idx+1})">Next Topic →</button>` : '<button class="btn btn-primary" onclick="showComplete()">🎉 Complete!</button>'}
    </div>
  `;
  if (t.setup) setTimeout(() => t.setup(), 50);
  // Mark topic done
  done.add(t.id);
  localStorage.setItem('ca_done', JSON.stringify([...done]));
  buildNav();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (ni) ni.classList.add('active');
}

function buildQuiz(quiz, qIdx) {
  if (qIdx >= quiz.length) return '';
  const q = quiz[qIdx];
  return `
    <div class="quiz-section" id="quiz-box">
      <div class="quiz-header">
        <h3>Quick Check</h3>
        <span class="quiz-badge">Q ${qIdx+1} / ${quiz.length}</span>
      </div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">
        ${q.opts.map((o,i) => `<button class="quiz-opt" id="opt-${i}" onclick="answerQ(${i},${q.ans},${qIdx},${quiz.length})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="quiz-nav">
        <span class="quiz-progress" id="quiz-prog">Answer to continue</span>
        <button class="btn" id="quiz-next-btn" onclick="nextQ(${qIdx+1})" style="display:none">Next Question →</button>
      </div>
    </div>
  `;
}

window.answerQ = (chosen, correct, qIdx, total) => {
  const quiz = topics[currentTopic].quiz;
  const q = quiz[qIdx];
  document.querySelectorAll('.quiz-opt').forEach((b,i) => {
    b.classList.add('disabled');
    if (i === correct) b.classList.add('correct');
    else if (i === chosen && chosen !== correct) b.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-feedback');
  const isCorrect = chosen === correct;
  fb.className = 'quiz-feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = (isCorrect ? '✓ Correct! ' : '✗ Not quite. ') + q.exp;
  if (qIdx + 1 < total) {
    document.getElementById('quiz-next-btn').style.display = '';
    document.getElementById('quiz-prog').textContent = isCorrect ? 'Great!' : 'Review and continue';
  } else {
    document.getElementById('quiz-prog').textContent = '✓ Quiz complete!';
    if (isCorrect) document.getElementById('quiz-prog').style.color = 'var(--green)';
  }
};

window.nextQ = (nextIdx) => {
  const quiz = topics[currentTopic].quiz;
  const qBox = document.getElementById('quiz-box');
  qBox.outerHTML = buildQuiz(quiz, nextIdx);
};

window.showComplete = () => {
  document.getElementById('topic-content').innerHTML = `
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">🎓</div>
      <h2 style="color:var(--accent2);margin-bottom:10px">All Topics Covered!</h2>
      <p style="color:var(--text2)">You've studied all ${topics.length} topics in Computer Architecture.</p>
      <p style="color:var(--text3);font-size:13px;margin-top:20px">Topics completed: ${done.size} / ${topics.length}</p>
      <button class="btn btn-primary" style="margin-top:20px" onclick="loadTopic(0)">Start Over</button>
    </div>
  `;
};

// Scroll-to-top button
document.getElementById('main').addEventListener('scroll', () => {
  const st = document.getElementById('scroll-top');
  if (document.getElementById('main').scrollTop > 200) st.classList.add('visible');
  else st.classList.remove('visible');
});

// Init
buildNav();
loadTopic(0);
</script>
</body>
</html>
